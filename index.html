<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <title>Weather App</title>
</head>

<body>
    <div class="container">
        <header>
            <form class="search-form">
                <input type="text" placeholder="Search for a city..." class="search-input" />
                <input type="submit" class="search-button" />
            </form>
        </header>
        <main>
            <div class="para">
                <h1>
                    Port Elizabeth
                </h1>
            <div class= "temp" 
                <p>
                    <div class="weather-icon">⛅</div><div class="weather-temp">16</div> <div class="weather-units">&degC</div>
                </p>
            </div>
            </div>
            <div class ="speed">
                <p>
                    Tuesday 13:24, moderate rain</br>
                    Humidity: <span class="weather-hum"><strong>84%</strong></span>, Wind: <span class="weather-wind"><strong>8.2km/h,</strong></span>
                </p>
            </div>
        </main>
        <footer>
            This project is coded by
            <a href="https://github.com/zithamakasi" target="_blank">Zitha Makasi</a>, on <a
                href="https://github.com/zithamakasi/Zitha-app.git" target="_blank">GitHub</a> and <a
                href="https://zitha.netlify.app/" target="_blank">hosted on Netlify</a>
        </footer>
    </div>
</body>

</html>
