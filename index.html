<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <script src="https://unpkg.com/axios@1.13.2/dist/axios.min.js"></script>
    <link rel="stylesheet" href="style.css">
    <title>Weather App</title>
</head>

<body>
    <div class="container">
        <header>
            <form class="search-form" id="search-form">
                <input type="text" placeholder="Search for a city..." required id="search-form-input"
                    class="search-input" />
                <input type="submit" class="search-button" />
            </form>
        </header>
        <main>
            <div class="para">
                <div class="speed">
                    <h1 id="city"></h1>
                    <p>
                    <div class="paragraph">
                        <span id="time"></span>,<span id="condition"></span>
                        </br>
                        Humidity: <span class="weather-hum" id="humidity"><strong></strong></span>,
                        Wind: <span class="weather-wind" id="windy"><strong></strong></span>
                    </div>
                    </p>
                </div>
                <div class="temp">
                    <div class="weather-icon"> ⛅ </div>
                    <div class="weather-temp" id="temp"> <strong></strong> </div>
                    <div class="weather-units"> &degC </div>
                </div>
            </div>
        </main>
        <footer>
            This project is coded by
            <a href="https://github.com/zithamakasi" target="_blank">Zitha Makasi</a>, on
            <a href="https://github.com/zithamakasi/Zitha-app.git" target="_blank">GitHub</a> and
            <a href="https://zitha.netlify.app/" target="_blank">hosted on Netlify</a>
        </footer>
    </div>
    <script src="index.js"></script>
</body>

</html>
